[demo.sample]
sampleDir = demo/samples
mode = sample
sampletype = raw
outputMode = file
fileName = demo/logs/output.log
interval = 5
count = 2
earliest = -10m
latest = now

token.0.token = \d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}
token.0.replacementType = timestamp
token.0.replacement = %Y-%m-%d %H:%M:%S
